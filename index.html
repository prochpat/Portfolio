<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrik Procházka - Portfolio</title>
    <style>
        /* Základní nastavení webu */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: #000000;
        }

        /* Navigace a Hlavička */
        /* Navigace a Hlavička */
        header {
            position: sticky; 
            top: 0;
            background-color: rgba(255, 255, 255, 0.95); 
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            max-width: 1200px; /* Stejná maximální šířka jako má galerie */
            margin: 0 auto;    /* Vycentrování na střed */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 40px;
        }

        nav ul li a {
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Hlavní obsah */
        main {
            padding: 0 5% 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Společné nastavení pro mřížky (gridy) */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Tři sloupce */
            gap: 20px; /* Menší mezera pro fotky */
        }

        /* Společný styl pro zástupný blok fotky */
        .image-placeholder {
            width: 100%;
            aspect-ratio: 3 / 2; /* Klasický poměr stran fotky */
            background-color: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            overflow: hidden;
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- SEKCE 1: Úvodní statické fotky --- */
        .intro-photos {
            margin-top: 30px;
            margin-bottom: 60px; /* Větší mezera pod touto sekcí */
        }

        /* --- SEKCE 2: Alba (proklikávací) --- */
        .albums-section {
            border-top: 1px solid #eee; /* Jemná dělící čára */
            padding-top: 50px;
        }

        .section-title {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .album {
            display: block;
            transition: transform 0.3s ease;
        }

        .album:hover {
            transform: translateY(-5px);
        }

        /* Alba mají větší mezery */
        .albums-section .photo-grid {
            gap: 40px; 
        }

        .album-title {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* Responzivita pro mobilní telefony */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 5px;
                padding: 20px 5%;
            }
            
            nav ul {
                gap: 20px;
            }

            .photo-grid {
                grid-template-columns: 1fr; /* Na mobilu vše pod sebou */
                gap: 20px !important;
            }
            
            .intro-photos {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">Patrik Procházka</div>
            <nav>
                <ul>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#">O mně</a></li>
                    <li><a href="#">Kontakt</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        
        <section class="intro-photos">
            <div class="photo-grid">
                
                <div class="image-placeholder">
                    <span>Úvodní fotka 1</span>
                </div>

                <div class="image-placeholder">
                    <span>Úvodní fotka 2</span>
                </div>

                <div class="image-placeholder">
                    <span>Úvodní fotka 3</span>
                </div>

            </div>
        </section>


        <section class="albums-section">
            
            <h2 class="section-title">Galerie</h2>

            <div class="photo-grid">
                
                <a href="jordansko.html" class="album">
                    <div class="image-placeholder">
                        <span>Náhled Jordánsko</span>
                    </div>
                    <h3 class="album-title">Jordánsko</h3>
                </a>

                <a href="stockholm.html" class="album">
                    <div class="image-placeholder">
                        <span>Náhled Stockholm</span>
                    </div>
                    <h3 class="album-title">Stockholm</h3>
                </a>

                <a href="praha.html" class="album">
                    <div class="image-placeholder">
                        <span>Náhled Praha</span>
                    </div>
                    <h3 class="album-title">Praha</h3>
                </a>

            </div>
        </section>

    </main>

</body>
</html>
