<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrik Procházka - Portfolio</title>
    <style>
        /* Základní nastavení webu */
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }
        
        a {
            text-decoration: none;
            color: #000000;
        }

        /* Navigace a Hlavička */
        /* Navigace a Hlavička */
        header {
            position: sticky; 
            top: 0;
            background-color: rgba(255, 255, 255, 0.95); 
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 5%;
            max-width: 1200px; /* Stejná maximální šířka jako má galerie */
            margin: 0 auto;    /* Vycentrování na střed */
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 40px;
        }

        nav ul li a {
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* Hlavní obsah */
        main {
            padding: 0 5% 50px 5%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Společné nastavení pro Masonry mřížku (styl Pinterest) */
        .photo-grid {
            column-count: 3; /* Počet sloupců */
            column-gap: 20px; /* Mezera mezi sloupci */
        }

        /* Obal pro fotku nebo album */
        .album, .image-placeholder {
            break-inside: avoid; /* Zabrání tomu, aby se fotka "roztrhla" mezi dva sloupce */
            margin-bottom: 20px; /* Mezera pod každou fotkou */
            display: block;
        }

        .image-placeholder {
            width: 100%;
            background-color: #f4f4f4; /* Zůstane šedé pozadí, dokud se fotka nenačte */
            color: #888;
        }

        /* Samotná fotka si teď určí svou výšku sama */
        .image-placeholder img {
            width: 100%;
            height: auto; /* DŮLEŽITÉ: Fotka si zachová svůj originální poměr stran */
            display: block;
        }

        /* --- SEKCE 1: Úvodní statické fotky --- */
        .intro-photos {
            margin-top: 30px;
            margin-bottom: 60px; /* Větší mezera pod touto sekcí */
        }

        /* --- SEKCE 2: Alba (proklikávací) --- */
        .albums-section {
            border-top: 1px solid #eee; /* Jemná dělící čára */
            padding-top: 50px;
        }

        .section-title {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .album {
            display: block;
            transition: transform 0.3s ease;
        }

        .album:hover {
            transform: translateY(-5px);
        }

        /* Alba mají větší mezery */
        .albums-section .photo-grid {
            gap: 40px; 
        }

        .album-title {
            text-align: center;
            margin-top: 15px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            font-weight: normal;
        }

        /* Responzivita pro mobilní telefony */
        /* Responzivita pro mobilní telefony */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 15px;
                padding: 20px 5%; /* Těchto 5 % zajistí, že to nebude nalepené na okraji */
            }
            
            nav ul {
                gap: 20px;
                flex-wrap: wrap; /* Zalomí text na další řádek, pokud by byl displej moc úzký */
                justify-content: center;
            }

            .photo-grid {
                grid-template-columns: 1fr; /* Na mobilu vše pod sebou */
                gap: 10px !important;
            }
            
            .intro-photos {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
